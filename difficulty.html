<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Difficulty</title>
    <style>
        /* Global setup matching image aesthetics */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        /* Top Header Navigation bar layout tools */
        .header-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
        }

        /* Red Back Button styling framework */
        .back-btn {
            border: 3px solid #ff0000;
            background: transparent;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 10px 35px;
            text-decoration: none;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .back-btn:hover {
            background-color: rgba(255, 0, 0, 0.2);
        }

        /* Title banner layout rules matching serif design from image */
        .title-banner {
            border: 3px solid #ff0000;
            font-family: 'Times New Roman', Times, serif;
            font-size: 3.2rem;
            text-align: center;
            padding: 10px 40px;
            margin: 0 auto;
            width: fit-content;
        }

        /* Three column card choice organization container grid */
        .cards-grid {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Master wrapper framework structure for choices */
        .difficulty-card {
            background-color: #000000;
            width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Specific border coloring classes matching card choices */
        .easy-card { border: 4px solid #00ff00; }
        .normal-card { border: 4px solid #ffff00; }
        .bloxxer-card { border: 4px solid #ff0000; }

        /* Typography sizing structural headers */
        .card-title {
            font-size: 2.5rem;
            text-align: center;
            padding: 15px 0;
            width: 100%;
        }

        /* Box boundary lines splits headers from pictures */
        .easy-card .card-title { border-bottom: 4px solid #00ff00; }
        .normal-card .card-title { border-bottom: 4px solid #ffff00; }
        .bloxxer-card .card-title { border-bottom: 4px solid #ff0000; }

        /* Display windows housing screenshot graphic mockups */
        .image-viewport {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Description context typography presentation boxes */
        .card-desc {
            font-size: 1.15rem;
            line-height: 1.4;
            text-align: center;
            padding: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .easy-card .card-desc { border-top: 4px solid #00ff00; }
        .normal-card .card-desc { border-top: 4px solid #ffff00; }
        .bloxxer-card .card-desc { border-top: 4px solid #ff0000; }

        /* Bottom play initialization actions container */
        .play-row {
            margin-top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Play visual anchors styling recreation framework links */
        .play-btn {
            background: linear-gradient(to bottom, #99cc66, #447722);
            border: 2px solid #ffffff;
            border-radius: 4px;
            color: #000000;
            font-family: Arial, sans-serif;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 8px 30px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 0px rgba(255,255,255,0.4);
        }

        /* Styled pure CSS fallback icon matching green triangle layout elements */
        .play-icon {
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 16px solid #005500;
            display: inline-block;
        }

        .play-btn:hover {
            filter: brightness(1.1);
        }

        /* Layout modifications handling portable displays */
        @media (max-width: 1024px) {
            .header-container {
                flex-direction: column;
                gap: 20px;
            }
            .back-btn { position: static; }
            .title-banner { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- Hidden Background Audio Player Engine Element -->
    <audio id="menuMusic" autoplay loop>
        <source src="menu_music.mp3" type="audio/mpeg">
    </audio>

    <div class="header-container">
        <!-- Return route pointing back out toward home setup -->
        <a href="index.html" class="back-btn">Back</a>
        <div class="title-banner">Select Your Difficulty</div>
    </div>

    <div class="cards-grid">
        <!-- Easy Setting Selection Group -->
        <div class="difficulty-card easy-card">
            <div class="card-title">Easy</div>
            <!-- Update inline styles below replacing background URLs with final image path names -->
            <div class="image-viewport" style="background-image: url('easy_preview.png'); background-color: #333;"></div>
            <div class="card-desc">For players that want a super duper easy playthrough.</div>
            <div class="play-row">
                <a href="#" class="play-btn"><span class="play-icon"></span>Play</a>
            </div>
        </div>

        <!-- Normal Setting Selection Group -->
        <div class="difficulty-card normal-card">
            <div class="card-title">Normal</div>
            <div class="image-viewport" style="background-image: url('normal_preview.png'); background-color: #333;"></div>
            <div class="card-desc">A good amount of save stations for average players.</div>
            <div class="play-row">
                <a href="#" class="play-btn"><span class="play-icon"></span>Play</a>
            </div>
        </div>

        <!-- Bloxxer Setting Selection Group -->
        <div class="difficulty-card bloxxer-card">
            <div class="card-title">Bloxxer</div>
            <div class="image-viewport" style="background-image: url('bloxxer_preview.png'); background-color: #333;"></div>
            <div class="card-desc">Fewer save stations and less amount of souls dropped by enemies.</div>
            <div class="play-row">
                <a href="#" class="play-btn"><span class="play-icon"></span>Play</a>
            </div>
        </div>
    </div>

    <script>
        // Automatic bypass tool handling modern web browser auto-play blockers
        window.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('menuMusic');
            
            // Forces audio stream ignition on first initial mouse movement window interaction click action
            document.body.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play().catch(err => console.log("Audio play request handled:", err));
                }
            }, { once: true });
        });
    </script>
</body>
</html>
