<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Difficulty</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        body {
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            padding: 3vh 4vw;
            user-select: none;
            -webkit-user-select: none;
        }

        .header-container {
            width: 100%;
            display: flex;
            align-items: center;
            margin-bottom: 4vh;
            position: relative;
        }

        .back-btn {
            border: 3px solid #ff0000;
            background: transparent;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 10px 40px;
            text-decoration: none;
            text-transform: uppercase;
            cursor: pointer;
            position: absolute;
            left: 0;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .back-btn:hover {
            background-color: rgba(255, 0, 0, 0.2);
            transform: scale(1.03);
        }

        .back-btn:active {
            transform: scale(0.98);
        }

        .title-banner {
            border: 3px solid #ff0000;
            font-family: 'Times New Roman', Times, serif;
            font-size: 3.8rem;
            text-align: center;
            padding: 10px 60px;
            margin: 0 auto;
            width: fit-content;
            text-transform: capitalize;
        }

        .cards-grid {
            display: flex;
            gap: 2.5vw;
            width: 100%;
            flex: 1;
            justify-content: center;
            align-items: center;
            margin-bottom: 2vh;
        }

        .difficulty-card {
            background-color: #000000;
            flex: 1;
            max-width: 440px;
            height: 72vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .easy-card { border: 4px solid #00ff00; }
        .normal-card { border: 4px solid #ffff00; }
        .bloxxer-card { border: 4px solid #ff0000; }

        .card-title {
            font-size: 3rem;
            text-align: center;
            padding: 15px 0;
            width: 100%;
        }

        .easy-card .card-title { border-bottom: 4px solid #00ff00; }
        .normal-card .card-title { border-bottom: 4px solid #ffff00; }
        .bloxxer-card .card-title { border-bottom: 4px solid #ff0000; }

        .image-viewport {
            width: 100%;
            flex: 1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .card-desc {
            font-size: 1.3rem;
            line-height: 1.4;
            text-align: center;
            padding: 25px 20px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .easy-card .card-desc { border-top: 4px solid #00ff00; }
        .normal-card .card-desc { border-top: 4px solid #ffff00; }
        .bloxxer-card .card-desc { border-top: 4px solid #ff0000; }

        .play-row {
            padding-bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .play-btn {
            background: linear-gradient(to bottom, #99cc66, #447722);
            border: 2px solid #ffffff;
            border-radius: 4px;
            color: #000000;
            font-family: Arial, sans-serif;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 10px 45px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            box-shadow: 0 5px 8px rgba(0,0,0,0.6);
            text-shadow: 1px 1px 0px rgba(255,255,255,0.4);
            transition: filter 0.1s ease, transform 0.1s ease;
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 11px solid transparent;
            border-bottom: 11px solid transparent;
            border-left: 18px solid #005500;
            display: inline-block;
        }

        .play-btn:hover {
            filter: brightness(1.15);
            transform: scale(1.05);
        }

        .play-btn:active {
            transform: scale(0.98);
        }

        /* Expanded loading screen overlay layout interface */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .loading-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .loading-text {
            font-family: 'Times New Roman', Times, serif;
            font-size: 3.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @media (max-height: 750px) or (max-width: 1000px) {
            html, body { overflow-y: auto; height: auto; }
            .header-container { flex-direction: column; gap: 20px; margin-bottom: 20px; }
            .back-btn { position: static; width: fit-content; }
            .title-banner { font-size: 2.4rem; padding: 10px 30px; }
            .cards-grid { flex-direction: column; gap: 40px; margin-top: 20px; }
            .difficulty-card { width: 100%; max-width: 400px; height: 500px; }
        }
    </style>
</head>
<body>

    <audio id="menuMusic" autoplay loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Interactive Expanded Loading Screen Structure -->
    <div id="loader" class="loading-screen">
        <div class="loading-text">Loading Game...</div>
    </div>

    <div class="header-container">
        <a href="index.html" class="back-btn">Back</a>
        <div class="title-banner">Select Your Difficulty</div>
    </div>

    <div class="cards-grid">
        <div class="difficulty-card easy-card">
            <div class="card-title">Easy</div>
            <div class="image-viewport" style="background-image: url('easy_preview.png'); background-color: #1a1a1a;"></div>
            <div class="card-desc">For players that want a super duper easy playthrough.</div>
            <div class="play-row">
                <button class="play-btn" onclick="launchGame('easy')"><span class="play-icon"></span>Play</button>
            </div>
        </div>

        <div class="difficulty-card normal-card">
            <div class="card-title">Normal</div>
            <div class="image-viewport" style="background-image: url('normal_preview.png'); background-color: #1a1a1a;"></div>
            <div class="card-desc">A good amount of save stations for average players.</div>
            <div class="play-row">
                <button class="play-btn" onclick="launchGame('normal')"><span class="play-icon"></span>Play</button>
            </div>
        </div>

        <div class="difficulty-card bloxxer-card">
            <div class="card-title">Bloxxer</div>
            <div class="image-viewport" style="background-image: url('bloxxer_preview.png'); background-color: #1a1a1a;"></div>
            <div class="card-desc">Fewer save stations and less amount of souls dropped by enemies.</div>
            <div class="play-row">
                <button class="play-btn" onclick="launchGame('bloxxer')"><span class="play-icon"></span>Play</button>
            </div>
        </div>
    </div>

    <script>
        // Automatic bypass tool handling modern web browser auto-play blockers
        window.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('menuMusic');
            audio.preload = "auto";
            audio.load();

            function startMusic() {
                if (audio.paused) {
                    audio.play()
                        .then(() => {
                            console.log("Music successfully playing.");
                            removeInteractionListeners();
                        })
                        .catch(err => {
                            console.log("Interaction required:", err);
                        });
                }
            }

            function addInteractionListeners() {
                document.body.addEventListener('click', startMusic);
                document.body.addEventListener('touchstart', startMusic);
                document.body.addEventListener('keydown', startMusic);
            }

            function removeInteractionListeners() {
                document.body.removeEventListener('click', startMusic);
                document.body.removeEventListener('touchstart', startMusic);
                document.body.removeEventListener('keydown', startMusic);
            }

            addInteractionListeners();
            
Use code with caution.setTimeout(() => {startMusic();}, 100);});// Expanded Game Launch & State Management Logicfunction launchGame(difficultySelection) {// 1. Save data directly inside browser memory cachelocalStorage.setItem('selectedDifficulty', difficultySelection);console.log("Saved difficulty settings selection: " + difficultySelection);// 2. Trigger loading overlay visualization gridconst loader = document.getElementById('loader');loader.classList.add('active');// 3. Phase down music stream track volume smoothlyconst audio = document.getElementById('menuMusic');let fadeInterval = setInterval(() => {if (audio.volume > 0.1) {audio.volume -= 0.1;} else {clearInterval(fadeInterval);audio.pause();}}, 100);// 4. Route over into active primary execution gameplay engine layout after loading sequence completessetTimeout(() => {window.location.href = "game.html";}, 2000);}
